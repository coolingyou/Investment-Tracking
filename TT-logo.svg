<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68" width="250" height="68">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="5" y="8" width="56" height="56" rx="14" fill="url(#bg)" />
  <!-- T 字母 -->
  <text x="23" y="38" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="white">T</text>
  <!-- T 字母 -->
  <text x="37" y="48" font-family="Arial, sans-serif" font-weight="300" font-size="18" fill="rgba(255,255,255,0.7)">t</text>
  <!-- K线走势线条 -->
  <polyline points="20,54 30,46 40,50 50,40 60,44 70,32" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- TradeTracker 文字 -->
  <text x="75" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="url(#text)" letter-spacing="1">TradeTracker</text>
  <!-- 副标题 -->
  <text x="78" y="56" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#64748b">US Portfolio</text>
</svg>
