    <div class="header-actions">
      <div class="user-menu" id="userMenu" style="display:none;">
        <img id="userAvatar" class="user-avatar" src="" alt="" />
        <span class="user-name" id="userName"></span>
        <button class="btn btn-sm btn-secondary" id="btnLogout"><i class="fas fa-sign-out-alt"></i> 退出</button>
      </div>
      <span class="last-update" id="lastUpdate"><i class="far fa-clock"></i> 加载中...</span>
    </div>
  </header>

  <section class="stats-grid" id="statsGrid">
    <div class="stat-card blue">
      <div class="stat-label"><i class="fas fa-coins"></i> 总投入</div>
      <div class="stat-value blue" id="totalInvested">$0.00</div>
      <div class="stat-sub" id="totalInvestedSub">—</div>
    </div>
    <div class="stat-card cyan">
      <div class="stat-label"><i class="fas fa-sack-dollar"></i> 当前持仓市值</div>
      <div class="stat-value cyan" id="marketValue">$0.00</div>
      <div class="stat-sub" id="marketValueSub">—</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label"><i class="fas fa-circle-dollar-up"></i> 未实现盈亏</div>
      <div class="stat-value green" id="unrealizedPnl">$0.00</div>
      <div class="stat-sub" id="unrealizedPnlPct">+0.00%</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-label"><i class="fas fa-check-circle"></i> 已实现盈亏</div>
      <div class="stat-value purple" id="realizedPnl">$0.00</div>
      <div class="stat-sub" id="realizedPnlCount">0 笔交易</div>
    </div>
  </section>

  <section class="charts-section">
    <div class="chart-card">
      <div class="chart-header">
        <h3><i class="fas fa-chart-pie"></i> 持仓分布 (按市值)</h3>
        <i class="fas fa-ellipsis-h"></i>
      </div>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-header">
        <h3><i class="fas fa-chart-bar"></i> 各股未实现盈亏</h3>
        <i class="fas fa-ellipsis-h"></i>
      </div>
      <canvas id="barChart"></canvas>
    </div>
  </section>

  <div class="action-bar">
    <div class="left-group">
      <button class="btn btn-primary" id="btnAdd"><i class="fas fa-plus"></i> 记一笔交易</button>
      <button class="btn btn-success" id="btnRefresh"><i class="fas fa-sync-alt"></i> <span class="btn-text">刷新行情</span><i class="fas fa-spinner spinner"></i></button>
      <button class="btn btn-secondary" id="btnExport"><i class="fas fa-download"></i> 导出</button>
    </div>
    <div class="right-group">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="搜索代码 / 名称..." />
      </div>
    </div>
  </div>

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="holdings"><i class="fas fa-briefcase"></i> 当前持仓 <span class="badge" id="holdingsCount">0</span></button>
    <button class="tab-btn" data-tab="transactions"><i class="fas fa-list"></i> 交易记录 <span class="badge" id="txCount">0</span></button>
    <button class="tab-btn" data-tab="realized"><i class="fas fa-check-double"></i> 已实现盈亏</button>
  </div>

  <div class="table-wrapper active" id="tab-holdings">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>名称</th><th>代码</th><th>交易所</th><th>持有股数</th><th>均价</th><th>现价</th><th>市值</th><th>成本</th><th>未实现盈亏</th><th>盈亏率</th><th></th>
          </tr>
        </thead>
        <tbody id="holdingsBody"></tbody>
      </table>
    </div>
    <div class="empty-state active" id="emptyHoldings">
      <i class="fas fa-box-open"></i>
      <h3>暂无持仓</h3>
      <p>点击「记一笔交易」买入股票</p>
    </div>
  </div>

  <div class="table-wrapper" id="tab-transactions">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>日期</th><th>类型</th><th>名称</th><th>代码</th><th>交易所</th><th>股数</th><th>成交价</th><th>税费</th><th>成交总额</th><th>备注</th><th></th>
          </tr>
        </thead>
        <tbody id="transactionsBody"></tbody>
      </table>
    </div>
    <div class="empty-state active" id="emptyTx">
      <i class="fas fa-receipt"></i>
      <h3>暂无交易记录</h3>
      <p>点击「记一笔交易」开始记录</p>
    </div>
  </div>

  <div class="table-wrapper" id="tab-realized">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>代码</th><th>名称</th><th>买入金额</th><th>卖出金额</th><th>已实现盈亏</th><th>收益率</th><th>笔数</th>
          </tr>
        </thead>
        <tbody id="realizedBody"></tbody>
      </table>
    </div>
    <div class="empty-state active" id="emptyRealized">
      <i class="fas fa-receipt"></i>
      <h3>暂无已实现盈亏</h3>
      <p>卖出股票后会在这里显示实际盈亏</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">记一笔交易</h2>
    <p class="modal-sub" id="modalSub">记录买入或卖出操作</p>
    <div class="type-toggle" id="typeToggle">
      <button class="active-buy" data-type="buy"><i class="fas fa-arrow-trend-up"></i> 买入</button>
      <button data-type="sell"><i class="fas fa-arrow-trend-down"></i> 卖出</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>股票 / ETF 名称</label>
        <input type="text" id="f_name" placeholder="如：Apple" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>代码 (Ticker)</label>
        <input type="text" id="f_ticker" placeholder="如：AAPL" class="input-uppercase" autocomplete="off" />
      </div>
      <div class="form-group">
        <label>交易所</label>
        <select id="f_exchange">
          <option value="NASDAQ">NASDAQ</option>
          <option value="NYSE">NYSE</option>
          <option value="AMEX">AMEX</option>
        </select>
      </div>
      <div class="form-group">
        <label>股数</label>
        <input type="number" id="f_shares" placeholder="100" step="any" min="0" />
      </div>
      <div class="form-group">
        <label>成交价 ($)</label>
        <input type="number" id="f_price" placeholder="150.00" step="0.001" min="0" />
      </div>
      <div class="form-group">
        <label>成交日期</label>
